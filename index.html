<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>דרשו | להחיות את תורתו</title>
    <!-- The hero still is the first thing painted, and the film is the
         heaviest thing on the page; both are named here so the browser starts
         them while it is still parsing, rather than after React mounts. -->
    <link rel="preload" href="/assets/hero-poster.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="/assets/hero.mp4" as="video" type="video/mp4" />

    <!-- The two faces that carry the first screen, fetched in parallel with
         the stylesheet so headings and body text paint in the real families
         straight away rather than swapping in afterwards. -->
    <link rel="preload" href="/fonts/levi-bold-aaa.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/atlas-regular-aaa.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Fallbacks only: the licensed families above are self-hosted and lead
         the stacks in tokens.css. These cover the case where a woff2 fails. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
